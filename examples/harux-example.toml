# Harux Configuration
# All values shown below are the built-in defaults.
# Uncomment and change only the settings you need.
# Environment variables (MLLP_PORT, WEB_PORT, RUST_LOG) override this file.

# [server]
# mllp_port = 2575
# web_port = 8080
# mllp_bind = "0.0.0.0"   # 127.0.0.1 = this machine only, :: = IPv6 too
# web_bind = "0.0.0.0"
# DNS names the web UI is opened under (IP addresses and localhost always work).
# Other Host headers are refused to block DNS rebinding.
# allowed_hosts = ["harux.klinik.local"]

# [logging]
# level = "info"
# file = "logs/harux.log" # omit or empty = no file logging; daily files harux.log.YYYY-MM-DD
# max_files = 14          # daily files to keep (today's included), 0 = keep all

# [store]
# max_messages = 10000
# max_memory_mb = 512

# [mllp]
# max_message_size_mb = 10
# read_timeout_secs = 60
# write_timeout_secs = 30
