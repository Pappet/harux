# Harux Configuration
# All values shown below are the built-in defaults.
# Uncomment and change only the settings you need.
# Environment variables (MLLP_PORT, WEB_PORT, RUST_LOG) override this file.

# [server]
# mllp_port = 2575
# web_port = 8080
# mllp_bind = "0.0.0.0"   # 127.0.0.1 = this machine only, :: = IPv6 too
# web_bind = "0.0.0.0"
# DNS names the web UI is opened under (IP addresses and localhost always work).
# Other Host headers are refused to block DNS rebinding.
# allowed_hosts = ["harux.klinik.local"]
# shutdown_timeout_secs = 10  # how long shutdown waits for MLLP connections

# [logging]
# level = "info"
# file = "logs/harux.log" # omit or empty = no file logging; daily files harux.log.YYYY-MM-DD
# max_files = 14          # daily files to keep (today's included), 0 = keep all

# [store]
# max_messages = 10000
# max_memory_mb = 512
# bookmark_budget_percent = 50  # share of the limits bookmarks may hold (0-80)

# [mllp]
# max_message_size_mb = 10
# read_timeout_secs = 60
# write_timeout_secs = 30
# max_connections = 100

# [send]
# Off unless switched on: with it on, everyone who can open the web UI can
# make this server send HL7 messages to any destination it reaches (or to
# the ones listed in allowed_destinations). See SECURITY.md -> Sending.
# enabled = false
# loopback_target = true          # offer Harux's own MLLP listener as a target
# connect_timeout_secs = 5
# response_timeout_secs = 30
# max_run_messages = 1000         # limits of one run
# max_run_store_percent = 25      # share of store.max_memory_mb a run may take
# max_concurrent_runs = 4
# allowed_destinations = ["orchestra-test.klinik.local:6000-6999"]  # empty = anywhere
