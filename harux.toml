# Harux Configuration
# All values shown are the built-in defaults.
# Change only the settings you need; delete or comment out the rest.
# Environment variables (MLLP_PORT, WEB_PORT, RUST_LOG) override this file.

[server]
mllp_port = 2575
web_port = 8080
# Addresses the listeners bind to: 0.0.0.0 = every IPv4 interface,
# :: = every interface incl. IPv6, 127.0.0.1 = this machine only
# (e.g. the web UI behind a reverse proxy with TLS and login).
mllp_bind = "0.0.0.0"
web_bind = "0.0.0.0"
# How long shutdown waits for open MLLP connections to finish.
shutdown_timeout_secs = 10
# DNS names the web UI is opened under (IP addresses and localhost always work).
# Other Host headers are refused to block DNS rebinding.
# allowed_hosts = ["harux.klinik.local"]

[logging]
level = "info"
# file = "logs/harux.log"  # uncomment to enable file logging: one file per day,
#                            # logs/harux.log.YYYY-MM-DD
# Daily files to keep, today's included; older ones are deleted. 0 = keep all.
max_files = 14

[store]
max_messages = 10000
max_memory_mb = 512
# Max share of the two limits above that bookmarked messages may hold under
# memory pressure (0-80). Older bookmarks beyond this budget are evicted.
bookmark_budget_percent = 50

[mllp]
max_message_size_mb = 10
read_timeout_secs = 60
write_timeout_secs = 30
max_connections = 100

[send]
# Sending from the web UI and the API. Off unless it is switched on here:
# with it on, everyone who can open the web UI can make this server send
# HL7 messages to any destination it reaches (or to the ones listed in
# allowed_destinations). See SECURITY.md -> Sending.
enabled = false
# Offer Harux's own MLLP listener as the target "This Harux".
loopback_target = true
connect_timeout_secs = 5
response_timeout_secs = 30
# Limits of one run (several messages in one request).
max_run_messages = 1000
max_run_store_percent = 25     # share of store.max_memory_mb a run may take
max_concurrent_runs = 4
# Where users may send. Empty = any host and port.
# Entries are host:port or host:from-to ([v6]:port for IPv6 addresses).
# allowed_destinations = ["orchestra-test.klinik.local:6000-6999"]
