# Harux Configuration
# All values shown are the built-in defaults.
# Change only the settings you need; delete or comment out the rest.
# Environment variables (MLLP_PORT, WEB_PORT, RUST_LOG) override this file.

[server]
mllp_port = 2575
web_port = 8080
# DNS names the web UI is opened under (IP addresses and localhost always work).
# Other Host headers are refused to block DNS rebinding.
# allowed_hosts = ["harux.klinik.local"]

[logging]
level = "info"
# file = "logs/harux.log"  # uncomment to enable file logging (daily rotation)

[store]
max_messages = 10000
max_memory_mb = 512
# Max share of the two limits above that bookmarked messages may hold under
# memory pressure (0-80). Older bookmarks beyond this budget are evicted.
bookmark_budget_percent = 50

[mllp]
max_message_size_mb = 10
read_timeout_secs = 60
write_timeout_secs = 30
max_connections = 100
